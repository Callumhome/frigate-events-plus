name: Build Frigate Events Plus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify distributable exists
        run: test -s frigate-events-plus.js
      - name: Verify custom element registration
        run: grep -q 'frigate-events-plus' frigate-events-plus.js
      - name: Verify bundle has expected card registration
        run: grep -q 'customCards' frigate-events-plus.js
      - name: Create beta 3 release and attach bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.5.0-beta.3 >/dev/null 2>&1; then
            gh release create v2.5.0-beta.3 frigate-events-plus.js \
              --prerelease \
              --title "v2.5.0-beta.3" \
              --notes "Beta 3: adds the Home Assistant visual card editor for configuring watched-event hiding, reviewed-event hiding, and the compact empty state without YAML edits. The card can now be configured using Home Assistant's visual editor. Choose whether to hide reviewed events, hide clips after full playback, collapse the card when empty, and edit the empty-state message. These options hide items from the card only; they do not delete Frigate recordings or review data."
          else
            gh release upload v2.5.0-beta.3 frigate-events-plus.js --clobber
          fi
      - name: Commit updated distributable
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- frigate-events-plus.js; then
            git add frigate-events-plus.js
            git commit -m "build: update Frigate Events Plus bundle"
            git pull --rebase origin main
            git push
          fi
