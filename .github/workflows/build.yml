name: Build Frigate Events Plus

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Verify distributable exists
        run: test -s frigate-events-plus.js

      - name: Verify custom element registration
        run: grep -q 'frigate-events-plus' frigate-events-plus.js

      - name: Verify bundle has expected card registration
        run: grep -q 'customCards' frigate-events-plus.js

      - name: Attach bundle to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" frigate-events-plus.js --clobber
          else
            if [[ "$TAG_NAME" == *"-"* ]]; then
              gh release create "$TAG_NAME" frigate-events-plus.js \
                --prerelease \
                --generate-notes \
                --title "$TAG_NAME"
            else
              gh release create "$TAG_NAME" frigate-events-plus.js \
                --generate-notes \
                --title "$TAG_NAME"
            fi
          fi

      - name: Commit updated distributable
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- frigate-events-plus.js; then
            git add frigate-events-plus.js
            git commit -m "build: update Frigate Events Plus bundle"
            git pull --rebase origin main
            git push
          fi
